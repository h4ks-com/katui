name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the tag names the workspace version and every gate passes on it
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,typos,cbindgen
      - uses: Swatinem/rust-cache@v2
      - run: just release-check "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - run: just ci

  wheels:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist

  # the source package builds a working module on its own
  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - run: just py-test-sdist bindings/python/dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist

  # the built wheels, installed the way users install them, pass the tests;
  # the musl wheels are built in the same containers but run untested here
  wheel-tests:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: just py-test-wheel dist

  # the C library per platform: the header, the static and the shared library
  c-dist:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just c-dist ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: c-dist-${{ matrix.target }}
          path: target/dist/*.tar.gz

  # the C archives, attached to the GitHub release of the tag
  c-release:
    needs: c-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: c-dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  # the go module: a commit off the release tag that adds the static
  # libraries, tagged bindings/go/vX.Y.Z so `go get` needs no rust
  go-release:
    needs: c-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v8
        with:
          pattern: c-dist-*
          merge-multiple: true
          path: dist
      - run: just go-release dist
      - run: just go-publish

  crates:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/katui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io
      - run: just crates-publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

  pypi:
    needs: [wheel-tests, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/katui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # the native node module for each platform; glibc builds link against
  # glibc 2.17 and musl builds cross-compile with zig
  node-binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: --cross-compile }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, flags: --cross-compile }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: just node-artifact "$TARGET" $FLAGS
        env:
          TARGET: ${{ matrix.target }}
          FLAGS: ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/artifacts/*.node

  # the main package and one package per native module, as npm tarballs
  node-pack:
    needs: node-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          merge-multiple: true
          path: node-dist
      - run: just node-pack node-dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: target/npm/*.tgz

  # the tarballs, installed the way users install them, pass the tests on
  # the oldest supported node; the musl packages ship without that test
  node-pack-tests:
    needs: node-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: target/npm
      - run: just node-test-pack

  npm:
    needs: node-pack-tests
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/katui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: npm-dist
      - run: just node-publish npm-dist
