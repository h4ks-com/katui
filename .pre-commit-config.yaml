# managed with prek (`just hooks` installs it); hooks call the justfile,
# the single source of truth for every check
repos:
  - repo: local
    hooks:
      - id: fmt
        name: just fmt-check
        entry: just fmt-check
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: just clippy
        entry: just clippy
        language: system
        types: [rust]
        pass_filenames: false
      - id: commit-msg
        name: conventional commit message
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
