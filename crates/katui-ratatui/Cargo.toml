[package]
name = "katui-ratatui"
description = "Ratatui Backend implementation over the katui scene and presenters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
image.workspace = true
katui-present.workspace = true
katui-proto.workspace = true
katui-scene.workspace = true
ratatui.workspace = true
thiserror.workspace = true

katui-rt = { workspace = true, optional = true }

[features]
# the event loop that runs a ratatui app on the terminal; the backend
# itself stays pure without it
run = ["dep:katui-rt"]

[dev-dependencies]
katui-draw.workspace = true
katui-rt.workspace = true

[lints]
workspace = true

[[example]]
name = "viewer"
required-features = ["run"]
