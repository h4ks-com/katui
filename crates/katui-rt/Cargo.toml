[package]
name = "katui-rt"
description = "The katui runtime: the tty transport, terminal lifecycle and loops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
katui-present.workspace = true
katui-proto.workspace = true
katui-scene.workspace = true
thiserror.workspace = true
gilrs = { workspace = true, optional = true }

[features]
# game controllers through gilrs; on Linux this needs libudev
gamepad = ["dep:gilrs"]

[target.'cfg(unix)'.dependencies]
# maps shared memory frames, which macOS will not take through write()
memmap2.workspace = true
rustix.workspace = true
signal-hook.workspace = true

# safe wrappers over the console calls, since unsafe is denied here
[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true

# the snake demo's soak test builds its frames with the image crate
[dev-dependencies]
base64.workspace = true
flate2.workspace = true
image.workspace = true

[lints]
workspace = true

[[example]]
name = "pads"
required-features = ["gamepad"]
