[default]
# deliberate non-words that must stay verbatim
extend-ignore-re = [
  'PNGs',
  'flate2',
  # the image crate's frame delay accessor
  'numer_denom_ms',
  # unicode escapes such as the placeholder diacritics read as words
  '\\u\{[0-9a-fA-F]+\}',
]

[default.extend-words]
katui = "katui"
sixel = "sixel"
ratatui = "ratatui"
wezterm = "wezterm"

[files]
extend-exclude = ["Cargo.lock", "LICENSE-APACHE", "research"]
