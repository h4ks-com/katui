[workspace]
resolver = "3"
members = [
    "crates/katui",
    "crates/katui-app",
    "crates/katui-content",
    "crates/katui-draw",
    "crates/katui-game",
    "crates/katui-layout",
    "crates/katui-present",
    "crates/katui-proto",
    "crates/katui-ratatui",
    "crates/katui-rt",
    "crates/katui-scene",
    "crates/katui-ui",
    "crates/katui-widgets",
]
exclude = ["demos/obby-chat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusfillipe/katui"
categories = ["command-line-interface", "gui"]
keywords = ["terminal", "tui", "kitty-graphics", "ratatui"]

[workspace.dependencies]
base64 = "0.22"
cosmic-text = "0.19"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
katui-app = { path = "crates/katui-app" }
katui-content = { path = "crates/katui-content" }
katui-draw = { path = "crates/katui-draw" }
katui-game = { path = "crates/katui-game" }
katui-layout = { path = "crates/katui-layout" }
katui-present = { path = "crates/katui-present" }
katui-proto = { path = "crates/katui-proto" }
katui-ratatui = { path = "crates/katui-ratatui" }
katui-rt = { path = "crates/katui-rt" }
katui-scene = { path = "crates/katui-scene" }
katui-ui = { path = "crates/katui-ui" }
katui-widgets = { path = "crates/katui-widgets" }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
signal-hook = { version = "0.3", default-features = false }
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
rustix = { version = "1", default-features = false, features = ["std", "termios", "event", "pty", "fs"] }
taffy = "0.15"
thiserror = "2"
tiny-skia = "0.12"
unicode-segmentation = "1"
unicode-width = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
# lints newer than the msrv fire as unknown; allow them instead of failing
# the build (priority -2 so a later -D warnings cannot re-enable them)
unknown_lints = { level = "allow", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
# a function scoring over 20 grew a second job; split it (clippy.toml)
cognitive_complexity = "warn"
# pedantic lints we allow
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
# a nursery lint: assert!(x.is_empty()) reads better than the assert_eq form
assert_is_empty = "allow"
