[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "katui"
description = "Pixel apps, games and documents in the terminal, drawn with kitty graphics"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["terminal", "tui", "kitty", "graphics", "games"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/h4ks-com/katui"
Documentation = "https://github.com/h4ks-com/katui/blob/main/docs/python.md"
"API reference" = "https://h4ks-com.github.io/katui/katui/"
Source = "https://github.com/h4ks-com/katui/tree/main/bindings/python"
Issues = "https://github.com/h4ks-com/katui/issues"

[dependency-groups]
dev = ["maturin>=1.9.4,<2", "mypy>=1.13", "pytest>=8", "ruff>=0.8", "ty"]

[tool.maturin]
module-name = "katui._katui"
python-source = "python"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "PERF", "RET", "PIE"]
# examples and tests compare against literal pixel sizes and colors
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-statements = 50

[tool.ty.environment]
# the tests import the examples and conftest by name, the way pytest runs them
extra-paths = ["examples", "tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.mypy]
strict = true
files = ["python/katui", "examples", "tests"]
