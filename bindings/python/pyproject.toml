[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "katui"
description = "Pixel apps, games and documents in the terminal, drawn with kitty graphics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["terminal", "tui", "kitty", "graphics", "games"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/matheusfillipe/katui"
Documentation = "https://github.com/matheusfillipe/katui/blob/main/docs/python.md"
"API reference" = "https://matheusfillipe.github.io/katui/katui/"
Source = "https://github.com/matheusfillipe/katui/tree/main/bindings/python"
Issues = "https://github.com/matheusfillipe/katui/issues"

[dependency-groups]
dev = ["maturin>=1.9.4,<2", "mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[tool.maturin]
module-name = "katui._katui"
python-source = "python"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["python/katui", "examples", "tests"]
