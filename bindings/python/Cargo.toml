[package]
name = "katui-python"
description = "Python bindings for katui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_katui"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
katui-app.workspace = true
katui-bindings.workspace = true
katui-content = { workspace = true, features = ["html"] }
katui-draw.workspace = true
katui-game.workspace = true
katui-proto.workspace = true
katui-scene.workspace = true
katui-ui.workspace = true
katui-widgets.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py314"] }

[lints]
workspace = true
