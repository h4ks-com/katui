version: "2"
linters:
  enable:
    - dupl
    - gocognit
    - gocyclo
    - errorlint
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 100
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
